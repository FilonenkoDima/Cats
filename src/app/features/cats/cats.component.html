<form [formGroup]="form">
  <mat-form-field>
    <mat-label>Breed</mat-label>
    <input type="text"
           placeholder="Enter breed"
           matInput
           formControlName="breedName"
           [matAutocomplete]="auto">
    <mat-autocomplete #auto="matAutocomplete">
      @for (breed of breeds$ | async; track breed) {
        <mat-option [value]="breed.name">{{ breed.name }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Enter number of cats</mat-label>
    <input matInput placeholder="Ex. 10" [value]="form.value.count" type="number" formControlName="count" #count />
  </mat-form-field>

  <button (click)="loadCats()">Cats</button>
</form>


<div class="container-sm">
  <div class="row mt-3 g-3">

      @for (cat of cats$ | async |
        slice: lowValue : highValue; track $index) {
        <div class="col-md-3 px-3">
          <div class="card" >
            <img class="img-fluid" style="height: 200px" [src]="cat.imageUrl" alt="Cat image">
          </div>
        </div>
      }
    <mat-paginator [length]="(cats$ | async)?.length || 0"
                   [pageSize]="pageSize"
                   [pageSizeOptions]="[4, 8, 12]"
                   (page)="getPaginatorData($event)"
                   aria-label="Select page">

    </mat-paginator>
  </div>
</div>
